apiVersion: v1
kind: Service
metadata:
  name: heart-disease-api
  namespace: heart-disease
  labels:
    app.kubernetes.io/name: heart-disease-api
spec:
  # Docker Desktop maps LoadBalancer services to localhost:<port>;
  # on minikube run `minikube tunnel`; on GKE/EKS/AKS a cloud LB gets a public IP.
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: heart-disease-api
  ports:
    - name: http
      port: 8080
      targetPort: http
